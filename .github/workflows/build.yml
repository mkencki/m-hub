name: build

# The NSIS installer will NOT build on a machine with Smart App Control enabled: NSIS
# generates its uninstaller by RUNNING the freshly built installer, and SAC kills an
# unsigned file that carries no reputation verdict (measured 2026-08-24, CodeIntegrity
# event 3077). A GitHub runner has no SAC, so the installer is built here.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    # The default GITHUB_TOKEN is often read-only, and without this the release step
    # bounces off a 403 only after a full, several-minute build.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # DEBUG=pw:browser makes Playwright log every process it launches – the command line,
      # which carries the spec's --user-data-dir, its stderr line by line, and its exit – and,
      # at worker teardown, every process still alive. Added after the tag run of 2026-09-07 on
      # d37f54a: 134 tests passed and the step still failed with "Worker teardown timeout of
      # 30000ms exceeded", because a process from some test had not exited and Playwright waited
      # for it without saying which. The same commit had passed this step on main minutes
      # earlier and passes locally, so the next occurrence has to explain itself.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DEBUG: pw:browser

      # The date and the commit go INTO the package, through electron-builder's extraMetadata,
      # so the packaged copy can say on its nameplate which build it is. The sources can know
      # neither – a run from them says "running from source" instead. The date is UTC, so the
      # same build reads the same everywhere, and the commit is the one checked out here, not
      # whatever the event that started the run happened to name. package.spec.js checks that
      # both arrived in the package.
      - name: Build installer
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          $commit = git rev-parse HEAD
          npm run dist:installer -- "-c.extraMetadata.buildDate=$date" "-c.extraMetadata.commit=$commit"

      # The packaged application is the thing people download, and the test that checks it –
      # asar, ESM in the main process, a CommonJS preload, dialogs above the native view – had
      # never run anywhere. It skips itself when dist/win-unpacked is absent, and the build
      # that creates it ran AFTER the end-to-end step; locally it skips too, because Smart App
      # Control refuses to build the package at all. Measured on the run of 2026-08-25: the
      # e2e step reported "1 skipped" at 20:24:32 and win-unpacked appeared at 20:24:34.
      #
      # It runs here rather than by moving the whole suite after the build, so a broken build
      # is still reported by fast tests instead of after five minutes of packaging.
      - name: Packaged application
        run: npx playwright test tests/e2e/package.spec.js

      # Whether Smart App Control will admit this file CANNOT be measured here, and pretending
      # otherwise would be worse than saying nothing: a GitHub runner has no SAC (the state is
      # printed below, and it is not 1), and the verdict itself comes from Microsoft's cloud,
      # which has no public API. It is also per FILE – measured 2026-08-25 on one machine,
      # minutes apart: 0.4.0 installed without a single CodeIntegrity event, while 0.2.0 was
      # refused with errno UNKNOWN and events 3033/3077/3118. Same builder, same repository,
      # both unsigned, Mark of the Web made no difference either way.
      #
      # So the release carries what CAN be established here – the exact file – and the command
      # that turns "will it install?" into a five-second measurement on the machine where the
      # answer actually matters.
      - name: Installer fingerprint
        run: |
          # Matched by SHAPE and not by name. The application was called msg-hub until 0.5.0,
          # and a glob carrying the name would have gone on finding nothing – quietly, since
          # a step that finds no file here does not fail, it publishes a release without a
          # fingerprint. The portable target ends in -portable.exe, so it cannot be caught.
          $exe = Get-ChildItem dist/*-installer.exe | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash
          $sac = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' -Name VerifiedAndReputablePolicyState -ErrorAction SilentlyContinue).VerifiedAndReputablePolicyState
          $sacText = switch ($sac) { 1 { 'enforcing' } 2 { 'evaluation' } 0 { 'off' } default { 'not present' } }
          Write-Host "installer : $($exe.Name)"
          Write-Host "sha256    : $hash"
          Write-Host "runner SAC: $sacText"
          # Built as an array rather than a here-string: PowerShell demands the closing "@ in
          # column zero, which no indented YAML block can give it.
          $probe = 'try { $p = Start-Process .\' + $exe.Name + ' -PassThru -ErrorAction Stop; Start-Sleep 3; Stop-Process -Id $p.Id -Force; ''ALLOWED - the installer started'' } catch { ''BLOCKED - '' + $_.Exception.Message }'
          $lines = @(
            '### Before you trust this file'
            ''
            '`' + $exe.Name + '`'
            'SHA256 `' + $hash + '`'
            ''
            'It is **not code-signed**. Whether Smart App Control admits it is a per-file verdict from'
            "Microsoft's cloud: it cannot be read off the file, and it was NOT measured here – this"
            'runner''s Smart App Control is *' + $sacText + '*. One command answers it on the machine'
            'where the answer matters, before you rely on it:'
            ''
            '```powershell'
            $probe
            '```'
            ''
            'A refusal also leaves events 3033/3077/3118 in **Microsoft-Windows-CodeIntegrity/Operational**.'
            'If it is blocked, run from source instead – that path needs no verdict from anybody.'
          )
          Set-Content installer-fingerprint.md ($lines -join "`n")

      - uses: actions/upload-artifact@v4
        with:
          name: M-HUB-installer
          path: dist/*-installer.exe
          if-no-files-found: error

      # The body of a release is the notes for THIS version followed by the installation
      # caveats. The notes file accumulates every version, so the section is cut out by its
      # heading rather than pasted whole – a release carrying the previous versions' notes as
      # well would read as though nothing had changed. A tag with no section fails here, loudly,
      # instead of publishing a release whose body is an empty promise.
      - name: Assemble the release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notes = Get-Content docs/release-notes.md -Raw
          $section = [regex]::Match($notes, "(?ms)^## $([regex]::Escape($version))\b.*?(?=^## |\z)")
          if (-not $section.Success) { throw "docs/release-notes.md has no section for $version" }
          $fingerprint = if (Test-Path installer-fingerprint.md) { "`n`n---`n`n" + (Get-Content installer-fingerprint.md -Raw) } else { '' }
          Set-Content release-body.md ($section.Value.TrimEnd() + $fingerprint + "`n`n---`n`n" + (Get-Content docs/installing.md -Raw))

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-installer.exe
          body_path: release-body.md
          generate_release_notes: true
